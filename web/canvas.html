<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>OmniTranslate Studio — Canvas</title>
  <link rel="stylesheet" href="/css/litegraph.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    body.canvas-page { max-width: none; margin: 0; height: 100vh; overflow: hidden; }

    #app-layout { display: flex; height: 100vh; }

    #node-palette {
      width: 212px;
      flex-shrink: 0;
      background: var(--bg-elevated);
      border-right: 1px solid var(--border-soft);
      overflow-y: auto;
      padding: 12px;
      box-sizing: border-box;
    }
    .palette-category {
      color: var(--text-faint);
      font-family: var(--font-mono);
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      margin: 12px 0 4px;
      text-transform: uppercase;
    }
    .palette-category:first-child { margin-top: 0; }
    .palette-header {
      padding: 14px 14px 8px;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-faint);
    }
    .palette-hint {
      padding: 0 14px 10px;
      font-size: 12.5px;
      color: var(--text-faint);
      line-height: 1.5;
    }
    .palette-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: grab;
      display: flex;
      gap: 8px;
      align-items: flex-start;
      font-size: 1rem;
      margin-bottom: 6px;
      padding: 8px 10px;
      user-select: none;
    }
    .palette-item:hover { background: var(--bg-hover); border-color: var(--accent); }
    .palette-item:active { cursor: grabbing; }
    .palette-item-icon { font-size: 15px; flex-shrink: 0; width: 16px; text-align: center; }
    .palette-item-body { min-width: 0; }
    .palette-item-name { font-size: 13.5px; font-weight: 500; color: var(--text); }
    .palette-item-desc { font-size: 11.5px; color: var(--text-faint); line-height: 1.35; margin-top: 2px; }

    #canvas-column { display: flex; flex-direction: column; flex: 1; min-width: 0; }
    #toolbar {
      align-items: center;
      background: var(--bg-elevated);
      border-bottom: 1px solid var(--border-soft);
      display: flex;
      gap: 12px;
      padding: 8px 12px;
    }
    #toolbar a { color: var(--text-dim); text-decoration: none; }
    #toolbar a:hover { color: var(--text); }

    #workspace-tabs-row {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-elevated);
      border-bottom: 1px solid var(--border-soft);
      padding: 6px 12px;
    }
    #workspace-tabs {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      flex: 1;
      min-width: 0;
    }
    .workspace-tab {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 8px 5px 10px;
      font-size: 13px;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .workspace-tab.active {
      border-color: var(--accent);
      color: var(--text);
      background: var(--bg-hover);
    }
    .workspace-tab-dirty-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }
    .workspace-tab-close {
      background: transparent;
      border: none;
      color: var(--text-faint);
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      padding: 0 2px;
    }
    .workspace-tab-close:hover { color: var(--danger); }
    #new-tab-button {
      background: transparent;
      border: 1px dashed var(--border);
      border-radius: 6px;
      color: var(--text-faint);
      cursor: pointer;
      font-size: 13px;
      padding: 5px 10px;
      flex-shrink: 0;
    }
    #new-tab-button:hover { border-color: var(--accent); color: var(--accent); }
    #open-workspace-button {
      background: transparent;
      border: 1px dashed var(--border);
      border-radius: 6px;
      color: var(--text-faint);
      cursor: pointer;
      font-size: 13px;
      padding: 5px 10px;
      flex-shrink: 0;
    }
    #open-workspace-button:hover { border-color: var(--accent); color: var(--accent); }
    #open-workspace-menu {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      min-width: 180px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 4px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.4);
      z-index: 10;
    }
    .open-workspace-menu-item {
      padding: 7px 10px;
      font-size: 13.5px;
      color: var(--text);
      border-radius: 5px;
      cursor: pointer;
    }
    .open-workspace-menu-item:hover { background: var(--bg-hover); }
    .open-workspace-menu-empty {
      padding: 7px 10px;
      font-size: 12.5px;
      color: var(--text-faint);
    }

    .tab-context-menu {
      position: fixed;
      min-width: 160px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 4px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.4);
      z-index: 20;
    }
    .tab-context-menu-item {
      padding: 7px 10px;
      font-size: 13.5px;
      color: var(--text);
      border-radius: 5px;
      cursor: pointer;
    }
    .tab-context-menu-item:hover { background: var(--bg-hover); }
    .tab-context-menu-item.danger { color: var(--danger); }

    .path-picker-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .path-picker-modal {
      width: 420px;
      max-height: 70vh;
      display: flex;
      flex-direction: column;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 14px;
      box-sizing: border-box;
    }
    .path-picker-breadcrumb {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-faint);
      margin-bottom: 8px;
      word-break: break-all;
    }
    .path-picker-list {
      flex: 1;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 10px;
    }
    .path-picker-item {
      padding: 7px 10px;
      font-size: 13.5px;
      color: var(--text);
      cursor: pointer;
    }
    .path-picker-item:hover { background: var(--bg-hover); }
    .path-picker-item.selected { background: var(--bg-hover); color: var(--accent); }
    .path-picker-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }
    .path-picker-actions button {
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 13px;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
    }
    .path-picker-actions button:hover { border-color: var(--accent); color: var(--accent); }

    .agent-template-picker-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .agent-template-picker-modal {
      width: 420px;
      max-height: 70vh;
      display: flex;
      flex-direction: column;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 14px;
      box-sizing: border-box;
    }
    .agent-template-picker-tabs {
      display: flex;
      gap: 6px;
      margin: 8px 0;
    }
    .agent-template-picker-tab {
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-faint);
      font-size: 12.5px;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
    }
    .agent-template-picker-tab.active,
    .agent-template-picker-tab:hover { border-color: var(--accent); color: var(--accent); }
    .agent-template-picker-list {
      flex: 1;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 10px;
    }
    .agent-template-picker-item {
      padding: 7px 10px;
      font-size: 13.5px;
      color: var(--text);
      cursor: pointer;
    }
    .agent-template-picker-item:hover { background: var(--bg-hover); }
    .agent-template-picker-item.selected { background: var(--bg-hover); color: var(--accent); }
    .agent-template-picker-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }
    .agent-template-picker-actions button {
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 13px;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
    }
    .agent-template-picker-actions button:hover { border-color: var(--accent); color: var(--accent); }

    #toolbar #settings-button {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-faint);
      font-size: 15px;
      font-weight: 400;
      padding: 5px 10px;
      border-radius: 6px;
    }
    #toolbar #settings-button:hover { background: transparent; border-color: var(--accent); color: var(--accent); }

    .lang-toggle {
      display: flex;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 2px;
    }
    #toolbar .lang-toggle-button {
      background: transparent;
      color: var(--text-faint);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      padding: 5px 12px;
    }
    #toolbar .lang-toggle-button:hover { background: transparent; }
    #toolbar .lang-toggle-button.active {
      background: var(--accent);
      color: var(--accent-text);
    }

    .settings-panel-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .settings-panel-modal {
      width: 380px;
      display: flex;
      flex-direction: column;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 16px;
      box-sizing: border-box;
      gap: 4px;
    }
    .settings-panel-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .settings-row { margin-bottom: 12px; }
    .settings-row label {
      display: block;
      color: var(--text-faint);
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .settings-segmented {
      display: flex;
      gap: 6px;
    }
    .settings-segmented-button {
      flex: 1;
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-faint);
      font-size: 12.5px;
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
    }
    .settings-segmented-button:hover { border-color: var(--accent); color: var(--accent); }
    .settings-segmented-button.active {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--bg-hover);
    }
    .settings-path-display {
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-muted);
      font-size: 11.5px;
      padding: 8px 10px;
      margin-bottom: 6px;
      word-break: break-all;
    }
    .settings-text-input {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 12.5px;
      padding: 8px 10px;
      box-sizing: border-box;
      font-family: inherit;
    }
    .settings-text-input:focus { outline: none; border-color: var(--accent); }
    .settings-panel-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 6px;
    }
    .settings-panel-actions button {
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 12px;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
    }
    .settings-panel-actions button:hover { border-color: var(--accent); color: var(--accent); }

    .output-manager-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .output-manager-modal {
      width: 480px;
      max-height: 78vh;
      display: flex;
      flex-direction: column;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 16px;
      box-sizing: border-box;
    }
    .output-manager-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 10px;
    }
    .output-manager-list {
      flex: 1;
      min-height: 60px;
      max-height: 260px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 10px;
    }
    .output-manager-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border-bottom: 1px solid var(--border-soft);
    }
    .output-manager-item:last-child { border-bottom: none; }
    .output-manager-item:hover { background: var(--bg-hover); }
    .output-manager-item-name {
      flex: 1;
      min-width: 0;
      font-size: 12.5px;
      color: var(--text);
      cursor: pointer;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .output-manager-item-name:hover { color: var(--accent); }
    .output-manager-item-meta {
      flex-shrink: 0;
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--text-faint);
    }
    .output-manager-item-delete {
      flex-shrink: 0;
      background: transparent;
      border: none;
      color: var(--text-faint);
      cursor: pointer;
      font-size: 12px;
      padding: 2px 4px;
    }
    .output-manager-item-delete:hover { color: var(--danger); }
    .output-manager-empty {
      padding: 14px 10px;
      font-size: 12px;
      color: var(--text-faint);
    }
    .output-manager-preview {
      max-height: 220px;
      overflow: auto;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 11.5px;
      line-height: 1.5;
      padding: 10px;
      margin: 0 0 10px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .output-manager-actions {
      display: flex;
      justify-content: flex-end;
    }
    .output-manager-actions button {
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 12px;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
    }
    .output-manager-actions button:hover { border-color: var(--accent); color: var(--accent); }

    #canvas-area { position: relative; flex: 1; min-height: 0; }
    #graph-canvas { display: block; width: 100%; height: 100%; }

    #minimap {
      position: absolute;
      left: 14px;
      bottom: 14px;
      width: 176px;
      height: 112px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 7px;
    }

    #log-console {
      border-top: 1px solid var(--border-soft);
      background: var(--bg-elevated);
      flex-shrink: 0;
    }
    #log-console-header {
      align-items: center;
      cursor: pointer;
      display: flex;
      gap: 8px;
      padding: 8px 12px;
    }
    #log-console-header span:first-child {
      color: var(--text-faint);
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    #log-console-body {
      max-height: 148px;
      overflow-y: auto;
      padding: 6px 0;
    }
    .log-entry {
      display: grid;
      grid-template-columns: 62px 190px 1fr;
      gap: 10px;
      padding: 3px 12px;
      font-family: var(--font-mono);
      font-size: 11.5px;
      line-height: 1.6;
      border-left: 2px solid transparent;
    }
    .log-entry > span:nth-child(2) {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .log-entry.log-entry-skipped { opacity: 0.55; }
    .log-entry.log-entry-skipped span:last-child { font-style: italic; }
    .log-entry.log-entry-root-error { border-left-color: var(--danger); background: rgba(217, 112, 112, 0.08); }
    .log-time { color: var(--text-faint); }
    .log-count-badge {
      font-family: var(--font-mono);
      font-size: 10.5px;
      background: var(--bg-input);
      color: var(--text-faint);
      border-radius: 8px;
      padding: 1px 6px;
    }

    #inspector-panel {
      width: 344px;
      flex-shrink: 0;
      background: var(--bg-elevated);
      border-left: 1px solid var(--border-soft);
      overflow-y: auto;
      padding: 14px 16px;
      box-sizing: border-box;
    }
    .inspector-empty {
      color: var(--text-dim);
      font-size: 13.5px;
      line-height: 1.6;
    }
    .inspector-header {
      display: flex;
      gap: 9px;
      align-items: center;
      padding-bottom: 12px;
      margin-bottom: 4px;
      border-bottom: 1px solid var(--border-soft);
    }
    .inspector-header-icon { font-size: 19px; }
    .inspector-header-type {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .inspector-header-title { font-size: 14px; font-weight: 600; margin-top: 2px; }
    .inspector-label {
      color: var(--text-faint);
      font-size: 11px;
      letter-spacing: 0.12em;
      margin: 14px 0 5px;
      text-transform: uppercase;
    }
    .inspector-input {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 8px 10px;
      font-size: 13.5px;
      box-sizing: border-box;
      font-family: inherit;
    }
    .inspector-input:focus { outline: none; border-color: var(--accent); }
    .inspector-browse-button {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-faint);
      font-size: 12.5px;
      padding: 6px 8px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 4px;
      box-sizing: border-box;
    }
    .inspector-browse-button:hover { border-color: var(--accent); color: var(--accent); }
    .inspector-actions {
      display: flex;
      gap: 7px;
      margin-top: 20px;
      padding-top: 14px;
      border-top: 1px solid var(--border-soft);
    }
    .inspector-actions button {
      flex: 1;
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 13px;
      padding: 9px;
      border-radius: 6px;
      cursor: pointer;
    }
    .inspector-actions button:hover { border-color: var(--accent); color: var(--accent); }
    .inspector-delete:hover { border-color: var(--danger) !important; color: var(--danger) !important; }
  </style>
</head>
<body class="canvas-page">
  <div id="app-layout">
    <aside id="node-palette"></aside>
    <div id="canvas-column">
      <div id="toolbar">
        <span data-i18n="brand" style="font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent); margin-right: 4px;">OMNITRANSLATE STUDIO</span>
        <span id="status" class="status-info"></span>
        <span style="flex: 1;"></span>
        <button id="run-button" data-i18n="runAllButton">Run</button>
        <button id="save-button" data-i18n="saveButton">Save</button>
        <button id="settings-button" data-i18n-title="settingsButton" title="Cài đặt">⚙</button>
        <div id="lang-toggle" class="lang-toggle">
          <button id="lang-vi-button" class="lang-toggle-button">VI</button>
          <button id="lang-en-button" class="lang-toggle-button">EN</button>
        </div>
      </div>
      <div id="workspace-tabs-row">
        <div id="workspace-tabs">
          <button id="new-tab-button" data-i18n-title="newTabButton" title="+ Workspace mới">+</button>
        </div>
        <div style="position: relative; flex-shrink: 0;">
          <button id="open-workspace-button" data-i18n="openWorkspaceButton">Mở workspace...</button>
        </div>
      </div>
      <div id="canvas-area">
        <canvas id="graph-canvas"></canvas>
        <canvas id="minimap" width="176" height="112"></canvas>
      </div>
      <div id="log-console">
        <div id="log-console-header">
          <span data-i18n="logTitle">Log chạy</span>
          <span id="log-count-badge" class="log-count-badge">0</span>
          <span style="flex: 1;"></span>
          <button id="clear-log-button" data-i18n="clearLog" style="background: transparent; border: none; color: var(--text-faint); font-size: 12px; cursor: pointer;">Xoá log</button>
        </div>
        <div id="log-console-body"></div>
